name: Renma CI Report

# One-time consumer-repository setup:
#   npm install --save-dev --save-exact renma@0.37.1
# Commit package.json and package-lock.json so npm ci installs this exact Renma version.

on:
  pull_request:

env:
  # Replace this with a canonical Skill ID from your repository.
  RENMA_SKILL_FOCUS: skill.release-prep

jobs:
  generate-renma-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - run: npm ci

      - name: Generate Renma inventory reports
        run: |
          mkdir -p renma-reports
          npx --no-install renma catalog . \
            --format markdown > renma-reports/catalog.md
          npx --no-install renma graph . \
            --focus "${RENMA_SKILL_FOCUS}" \
            --view composition \
            --format markdown > renma-reports/skill-composition.md

      - name: Generate Renma CI report
        id: ci-report
        continue-on-error: true
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --no-install renma ci-report . \
            --from "${FROM_SHA}" \
            --to "${TO_SHA}" \
            --format markdown \
            --fail-on-status warn > renma-reports/ci-report.md

      - name: Validate Renma Skills and Context
        id: scan
        continue-on-error: true
        run: npx --no-install renma scan . --fail-on high --strict

      - name: Upload Renma Skill reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: renma-skill-reports
          path: renma-reports/
          if-no-files-found: ignore

      - name: Enforce Renma result
        if: >-
          steps.ci-report.outcome == 'failure' ||
          steps.scan.outcome == 'failure'
        run: exit 1

  # Keep pull-request write permission out of the job that runs repository code.
  # Fork PRs retain the uploaded artifact but skip this write-capable job.
  comment-renma-ci-report:
    needs: generate-renma-reports
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Download Renma Skill reports
        id: download-reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: renma-skill-reports
          path: renma-reports

      - name: Comment Renma CI report on pull request
        if: >-
          steps.download-reports.outcome == 'success' &&
          hashFiles('renma-reports/ci-report.md') != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RENMA_CI_REPORT_PATH: renma-reports/ci-report.md
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const marker = "<!-- renma-ci-report -->";
            const report = readFileSync(process.env.RENMA_CI_REPORT_PATH, "utf8").trim();
            const body = `${marker}\n${report}\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
