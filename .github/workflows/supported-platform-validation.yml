name: Supported platform validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Supported platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code at exact caller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Compile platform contract tests
        run: npx --no-install tsc -p tsconfig.test.json

      - name: Run path, filesystem, and shell-family contract tests
        run: >-
          node --enable-source-maps --test
          dist-test/test/repository-paths.test.js
          dist-test/test/helper-command-evidence.test.js
          dist-test/test/executable-dependency-analyzer.test.js
          dist-test/test/public-json-compatibility.test.js

      - name: Verify packaged consumer and CLI startup
        run: npm run verify:package

      - name: Verify representative machine-readable scan
        run: node scripts/verify-platform-smoke.mjs
