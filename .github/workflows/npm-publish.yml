name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    name: Verify release tag and main identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify annotated release tag at exact origin/main
        run: node scripts/verify-release-tag.mjs

  validate-supported-runtime:
    name: Supported runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [minimum, lts]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read minimum supported Node version
        id: minimum-node
        run: echo "version=$(node scripts/min-supported-node.mjs)" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.runtime == 'minimum' && steps.minimum-node.outputs.version || 'lts/*' }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check minimum Node API compatibility
        run: npm run typecheck:node-min

      - name: Build package
        run: npm run build

      - name: Validate release repository with Renma
        if: matrix.runtime == 'lts'
        run: node dist/index.js scan . --fail-on high --strict

      - name: Check package contents
        run: npm run verify:package

  validate-supported-platform:
    name: Validate supported release platforms
    needs: verify-release-ref
    permissions:
      contents: read
    uses: ./.github/workflows/supported-platform-validation.yml

  publish:
    name: Publish to npm
    needs:
      [
        verify-release-ref,
        validate-supported-runtime,
        validate-supported-platform,
      ]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm run verify:package

      - name: Publish package
        # Uses npm trusted publishing (OIDC); required external controls are documented in docs/development/release-security.md.
        run: npm publish
