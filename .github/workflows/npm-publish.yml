name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-supported-runtime:
    name: Supported runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [minimum, lts]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read minimum supported Node version
        id: minimum-node
        run: echo "version=$(node scripts/min-supported-node.mjs)" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime == 'minimum' && steps.minimum-node.outputs.version || 'lts/*' }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm run verify:package

  publish:
    name: Publish to npm
    needs: validate-supported-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if [[ "$tag_version" == *-* ]]; then
            echo "Prerelease tag ${GITHUB_REF_NAME} is not published by this workflow."
            exit 1
          fi

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ${tag_version} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Check package contents
        run: npm run verify:package

      - name: Publish package
        # Uses npm trusted publishing (OIDC); configure this workflow as a trusted publisher on npmjs.com.
        run: npm publish
